<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeLink Learning Hub</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>📚 SafeLink Learning Hub</header>
  
  <nav>
    <a href="/index.html">🏠 Home</a>
    <a href="/learning.html">📚 Learning</a>
    <a href="/quiz.html">🧠 Quizzes</a>
    <a href="/simulation.html">🎮 Simulations</a>
    <a href="/dashboard.html">📊 Dashboard</a>
    <a href="/settings.html">⚙️ Settings</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
  </nav>

  <div class="container">
    <h2>🎓 Your Learning Path</h2>
    <p style="color: #aaa; margin-bottom: 30px;">Choose a module to start learning</p>
    
    <div id="modulesContainer">
      <div class="loader"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    async function loadModules() {
      try {
        const response = await fetch(`${API_URL}/learning/modules`, {
          headers: getHeaders()
        });
        
        const modules = await response.json();
        const container = document.getElementById('modulesContainer');
        
        container.innerHTML = modules.map(module => `
          <div class="module" onclick="window.location.href='/lesson.html?id=${module.id}'">
            <div class="module-info">
              <h3>${module.title}</h3>
              <div class="module-meta">
                <span class="badge-tag">${module.difficulty}</span>
                <span>⏱️ ${module.estimated_time}</span>
                <span>${module.progress.completed ? '✅ Completed' : '📝 Not started'}</span>
              </div>
              ${module.progress.completed ? `
                <div class="progress-bar">
                  <div class="progress-fill" style="width: 100%"></div>
                </div>
              ` : ''}
            </div>
          </div>
        `).join('');
      } catch (error) {
        showAlert('Failed to load modules', 'error');
      }
    }

    loadModules();
  </script>
</body>
</html>
