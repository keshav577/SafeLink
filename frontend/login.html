<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeLink - Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>🔐 SafeLink Login</header>

  <div class="container">
    <div class="form-container">
      <h2 style="text-align: center; margin-bottom: 30px;">Welcome Back!</h2>
      
      <div id="alertContainer"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="your@email.com" />
        </div>
        
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>
        
        <button type="submit" class="btn" style="width: 100%;" id="submitBtn">Login</button>
      </form>

      <p style="text-align: center; margin-top: 20px; color: #aaa;">
        Don't have an account? <a href="/onboarding.html" style="color: #4facfe;">Sign up</a>
      </p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    // Override checkAuth for login page
    function checkAuth() {
      const token = localStorage.getItem('token');
      if (token) {
        // If already logged in, redirect to dashboard
        window.location.href = '/dashboard.html';
      }
    }

    function showAlert(message, type = 'info') {
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type}`;
      alertDiv.textContent = message;
      
      const container = document.getElementById('alertContainer');
      container.innerHTML = '';
      container.appendChild(alertDiv);
      
      setTimeout(() => alertDiv.remove(), 5000);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      
      if (!email || !password) {
        showAlert('Please fill in all fields', 'error');
        return;
      }
      
      // Disable submit button
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';
      
      try {
        console.log('Attempting login with:', { email });
        
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        console.log('Server response:', data);
        
        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('userId', data.userId);
          localStorage.setItem('username', data.username);
          
          showAlert('Login successful! Redirecting...', 'success');
          
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);
        } else {
          showAlert(data.error || 'Invalid email or password', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login';
        }
      } catch (error) {
        console.error('Login error:', error);
        showAlert('Server error. Please check if the server is running and try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
    
    // Check auth on page load
    checkAuth();
  </script>
</body>
</html>
